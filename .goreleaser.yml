version: 2

project_name: ai-engine

# Release Please tags with the component prefix (ai-engine-v1.0.0);
# GoReleaser needs to know so it parses the semver correctly.
tag_prefix: ai-engine-v

builds:
  - id: ai-engine
    main: ./cmd/api
    binary: ai-engine
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

universal_binaries:
  - id: ai-engine-universal
    ids:
      - ai-engine
    replace: true

archives:
  - id: ai-engine
    builds:
      - ai-engine
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

release:
  # Release Please owns the draft and release notes; GoReleaser appends the
  # compiled archives/checksums, then publishes the draft.
  mode: keep-existing
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
