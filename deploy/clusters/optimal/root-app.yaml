apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-optimal-root
  namespace: argocd
  labels:
    ai-engine.io/tier: optimal
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nutcas3/ai-for-k8s
    targetRevision: HEAD
    path: deploy/clusters/optimal
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
