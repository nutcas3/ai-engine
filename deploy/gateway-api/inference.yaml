# Gateway API Inference Extension — model-aware routing to vLLM pods.
# CRDs: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/latest/download/manifests.yaml
# InferencePool = set of model-server pods + endpoint picker (Envoy ext-proc).
# InferenceModel = user-facing model name → backend mapping + traffic policy.
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferencePool
metadata:
  name: vllm-llama-pool
spec:
  targetPortNumber: 8000
  selector:
    app: vllm-llama
  endpointPickerRef:
    name: vllm-llama-epp
    port:
      number: 9002
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceModel
metadata:
  name: llama-chat
spec:
  modelName: llama-3-70b-chat
  criticality: Critical
  poolRef:
    name: vllm-llama-pool
  targetModels:
    - name: llama-3-70b-chat-v1
      weight: 90
    - name: llama-3-70b-chat-v2
      weight: 10 # canary
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-inference
spec:
  parentRefs:
    - name: inference-gateway
  rules:
    - backendRefs:
        - name: vllm-llama-pool
          group: inference.networking.x-k8s.io
          kind: InferencePool
